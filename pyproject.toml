[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logscope"
version = "0.1.0"
description = "Mine application logs for error patterns and produce an incident-triage summary: top exceptions, first-seen timestamps, errors by hour."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Manoj Kumar Kagitha" }]

[project.scripts]
logscope = "logscope.cli:main"

[tool.setuptools.packages.find]
include = ["logscope*"]
